[project]
name = "hybrid-lab"
version = "2026.9.30"
description = "Hybrid search in PostgreSQL 18: full-text, pgvector, BM25, RRF, and rerank, measured on FiQA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.42",
  "fastapi>=0.141",
  "pgvector>=0.5",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.2",
  "uvicorn>=0.52",
]

[project.scripts]
hybrid-lab = "hybrid_lab.server:main"

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "ipykernel>=7",
  "playwright>=1.62",
  "pytest>=9",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PLR", "D", "TID"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 60

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"py/*.py" = ["D", "E402", "B018"]
"tests/*.py" = ["D", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
