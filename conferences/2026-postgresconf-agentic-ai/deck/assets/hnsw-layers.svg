<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">HNSW: upper-layer navigation and base-layer search</title>
<desc id="desc">Three stacked planes show a sparse top layer, a middle layer with more connections, and a dense base layer. A highlighted path moves toward the query, descends at the same point, then considers multiple nearby candidates. This is a schematic, not an index trace.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b3f2a" stroke-width="1.5"/></marker></defs>
