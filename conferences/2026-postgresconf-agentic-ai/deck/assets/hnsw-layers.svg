<circle cx="165" cy="345" r="8"/><circle cx="204" cy="359" r="9"/><circle cx="255" cy="339" r="8"/><circle cx="326" cy="350" r="8"/><circle cx="422" cy="346" r="9"/><circle cx="491" cy="331" r="8"/><circle cx="540" cy="373" r="8"/><circle cx="588" cy="352" r="8"/><circle cx="460" cy="383" r="8"/><circle cx="381" cy="390" r="8"/><circle cx="305" cy="379" r="8"/>
</g>
<g fill="none" stroke="#6b3f2a" stroke-width="3" marker-end="url(#arrow)">
