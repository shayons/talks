<g fill="#6b3f2a"><circle cx="422" cy="76" r="9"/><circle cx="422" cy="211" r="9"/></g>
<path d="M572 320L581 329L572 338L563 329Z" fill="#c87830" stroke="#925422"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1c1410">
<text x="18" y="89" font-size="18" fill="#6b5d52">L2</text><text x="18" y="224" font-size="18" fill="#6b5d52">L1</text><text x="18" y="359" font-size="18" fill="#3f5c4b">L0</text>
<text x="710" y="77" font-size="26" font-weight="700">1. Find a promising region</text>
<text x="710" y="112" font-size="21" fill="#6b5d52">Greedy moves across sparse links.</text>
<text x="710" y="211" font-size="26" font-weight="700">2. Descend at the same point</text>
<text x="710" y="246" font-size="21" fill="#6b5d52">More nodes, more local detail.</text>
<text x="710" y="345" font-size="26" font-weight="700">3. Explore nearby candidates</text>
<text x="710" y="380" font-size="21" fill="#6b5d52">A bounded search; ef controls its breadth.</text>
<text x="596" y="330" font-size="16" fill="#925422">query</text>
