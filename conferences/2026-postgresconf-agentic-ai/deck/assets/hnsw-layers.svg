<path d="M70 199L500 169L673 248L244 285Z" fill="#fffbf4"/>
<path d="M70 334L500 304L673 383L244 420Z" fill="#e8eee5"/>
</g>
<g stroke="#cbb9a4" fill="none" stroke-width="2">
<path d="M204 89L422 76"/>
<path d="M165 210L204 224L326 215L422 211L540 238L381 255L204 224L422 211"/>
<path d="M165 345L204 359L255 339L326 350L422 346L491 331L540 373L588 352L422 346L460 383L381 390L305 379L204 359L381 390L326 350L460 383L540 373L491 331M255 339L305 379M165 345L326 350M381 390L422 346"/>
</g>
