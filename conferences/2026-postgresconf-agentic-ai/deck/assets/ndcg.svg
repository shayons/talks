<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">How NDCG@10 weighs each rank</title>
  <desc id="d">Bars for ranks 1 to 10 with height 1 divided by log2 of rank plus 1: rank 1 counts 1.00, rank 2 0.63, rank 3 0.50, falling to 0.29 at rank 10. Ranks 1, 3 and 7 hold known answers.</desc>
  <rect width="760" height="330" fill="#fffbf4"/>
  <g font-family="Source Sans 3, Helvetica Neue, sans-serif" fill="#1c1410">
    <text x="30" y="36" font-size="20" font-weight="600">Credit for a known answer at each rank</text>
    <text x="30" y="60" font-size="16" fill="#6b5d52">1 / log2(rank + 1): an answer at rank 1 is worth more than three answers at rank 10</text>
  </g>
  <g transform="translate(40 280)">
    <line x1="0" y1="0" x2="690" y2="0" stroke="#cbb9a4" stroke-width="2"/>
    <!-- bar heights = 180 * 1/log2(r+1) -->
    <rect x="10"  y="-180"   width="50" height="180"   fill="#3f5c4b"/>
    <rect x="79"  y="-113.6" width="50" height="113.6" fill="#e2d6c6"/>
    <rect x="148" y="-90"    width="50" height="90"    fill="#3f5c4b"/>
    <rect x="217" y="-77.5"  width="50" height="77.5"  fill="#e2d6c6"/>
    <rect x="286" y="-69.6"  width="50" height="69.6"  fill="#e2d6c6"/>
    <rect x="355" y="-64.1"  width="50" height="64.1"  fill="#e2d6c6"/>
    <rect x="424" y="-60"    width="50" height="60"    fill="#3f5c4b"/>
    <rect x="493" y="-56.8"  width="50" height="56.8"  fill="#e2d6c6"/>
    <rect x="562" y="-54.2"  width="50" height="54.2"  fill="#e2d6c6"/>
    <rect x="631" y="-52"    width="50" height="52"    fill="#e2d6c6"/>
    <g font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#1c1410" text-anchor="middle">
      <text x="35"  y="-188">1.00</text>
      <text x="104" y="-121">0.63</text>
      <text x="173" y="-98">0.50</text>
      <text x="242" y="-85">0.43</text>
      <text x="311" y="-77">0.39</text>
      <text x="380" y="-72">0.36</text>
      <text x="449" y="-68">0.33</text>
      <text x="518" y="-64">0.32</text>
      <text x="587" y="-62">0.30</text>
      <text x="656" y="-60">0.29</text>
    </g>
    <g font-family="Source Sans 3, Helvetica Neue, sans-serif" font-size="16" fill="#6b5d52" text-anchor="middle">
      <text x="35" y="24">1</text><text x="104" y="24">2</text><text x="173" y="24">3</text>
      <text x="242" y="24">4</text><text x="311" y="24">5</text><text x="380" y="24">6</text>
      <text x="449" y="24">7</text><text x="518" y="24">8</text><text x="587" y="24">9</text>
      <text x="656" y="24">10</text>
    </g>
  </g>
  <g font-family="Source Sans 3, Helvetica Neue, sans-serif" font-size="16">
    <rect x="470" y="84" width="16" height="16" fill="#3f5c4b"/>
    <text x="494" y="98" fill="#1c1410">known answer found at this rank</text>
  </g>
</svg>
