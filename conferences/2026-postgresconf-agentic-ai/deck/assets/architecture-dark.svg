<title id="title">Coffee and queries: conversation around PostgreSQL retrieval</title>
<desc id="desc">A request enters FastAPI. Strands provides structured intent and response generation. Python orchestrates PostgreSQL eligibility, lexical and vector candidates, RRF, and canonical fact checks. The database also records session history, audits, checkpoints and pending approvals. Product cards use canonical rows.</desc>
